name: YoukuTV
options:
  bundleIdPrefix: com.workbuddy
  deploymentTarget:
    tvOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  YoukuTV:
    type: application
    platform: tvOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      # ★ 关键修复：资源目录必须参与编译。
      # 之前 sources 只有 Sources/，Resources/Assets.xcassets 从未进入构建，
      # 产出的 .app 里没有 Assets.car —— 于是图标、启动图、Top Shelf 全部缺失，
      # Home Screen 上显示为空白方块、也没有名称。
      #
      # type 必须是 file（单一文件引用）：
      #   · type: folder → 被当普通文件夹原样拷贝进包，不经 actool 编译
      #   · type: group  → 被展开成 PBXGroup 子项，同样不是资源文件引用
      #   · type: file   → 生成 lastKnownFileType = folder.assetcatalog 的
      #                    PBXFileReference，actool 才会编译出 Assets.car
      - path: Resources/Assets.xcassets
        type: file
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Youku TV
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "用于局域网投屏与设备发现"
        # tvOS 26+ 的品牌资源：图标与 Top Shelf 图的引用名
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: App Icon
        TVTopShelfImage:
          TVTopShelfPrimaryImage: Top Shelf Image
          TVTopShelfPrimaryImageWide: Top Shelf Image Wide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.youkutv
        PRODUCT_NAME: YoukuTV
        TARGETED_DEVICE_FAMILY: 3
        # tvOS 26+ 用 brandassets，名字必须与 AppIcon.brandassets 一致
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: LaunchImage
        # 强制包含全部图标变体，避免某些配置下只编译部分尺寸
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
          - fetch
    scheme:
      testTargets:
        - YoukuTVTests
      gatherCoverageData: false

  YoukuTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: YoukuTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.youkutv.tests
        GENERATE_INFOPLIST_FILE: YES
