name: YoukuTV
options:
  bundleIdPrefix: com.workbuddy
  deploymentTarget:
    tvOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  YoukuTV:
    type: application
    platform: tvOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Youku TV
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "用于局域网投屏与设备发现"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.youkutv
        PRODUCT_NAME: YoukuTV
        TARGETED_DEVICE_FAMILY: 3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: LaunchImage
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
          - fetch
    scheme:
      testTargets:
        - YoukuTVTests
      gatherCoverageData: false

  YoukuTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: YoukuTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.youkutv.tests
        GENERATE_INFOPLIST_FILE: YES
